name: Refresh lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, 'deps: upgrade Next.js to current stable')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-lockfile.yml
          git commit -m "deps: refresh lockfile for Next.js upgrade" || exit 0
          git push
